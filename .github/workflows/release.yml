# Push tagu v* buduje NEUTRALNĄ paczkę silnika: launcher.zip + updater.zip
# bez adresu żadnego serwera (panel_config.json zostaje placeholderem).
# Konfigurację wstrzykuje admin panel (valheim-proxmox) przy pobieraniu —
# gracz dostaje gotowy launcher z panelu, nie z GitHuba. GitHub służy tylko
# updaterowi jako źródło aktualizacji silnika.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build launcher
        working-directory: lib/modules/launcher_module
        run: |
          flutter pub get
          flutter build windows --release

      - name: Build updater
        working-directory: lib/modules/updater_module
        run: |
          flutter pub get
          flutter build windows --release

      - name: Stamp version and pack
        shell: bash
        run: |
          L=lib/modules/launcher_module/build/windows/x64/runner/Release
          U=lib/modules/updater_module/build/windows/x64/runner/Release
          # Launcher porównuje version.txt z tagiem najnowszego release'u.
          echo "$GITHUB_REF_NAME" > "$L/data/flutter_assets/assets/version.txt"
          (cd "$L" && 7z a -tzip "$GITHUB_WORKSPACE/launcher.zip" .)
          (cd "$U" && 7z a -tzip "$GITHUB_WORKSPACE/updater.zip" .)

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            launcher.zip
            updater.zip
